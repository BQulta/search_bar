name: Data Pipeline

on:
  schedule:
    # Run at 3:30 PM Egypt time (1:30 PM UTC)
    - cron: '30 13 * * *'
    # Run at 6:30 PM Egypt time (4:30 PM UTC)  
    - cron: '30 16 * * *'
  workflow_dispatch:  # Allow manual triggering

jobs:
  run-data-pipeline:
    runs-on: self-hosted
    
    steps:
    - name: Checkout SG-AI-Team/search_bar
      uses: actions/checkout@v4
      

    - name: Activate virtual environment
      run: |
        source /home/beshoy_ashraf/search-bar-test/search-bar-test/bin/activate
        
        
    - name: Commit and push if changes
      run: |
        git config --local user.email "beshoy.qulta@studentgator.com"
        git config --local user.name "BQulta"
        git add data/search_db
        git diff --staged --quiet || git commit -m "Automated data pipeline update - $(date)"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

    - name: Restart Docker container with latest changes
      run: |
        # Stop any container using port 5000
        sudo docker ps -q --filter "publish=5000" | xargs -r sudo docker stop
        
        # Remove any stopped containers with our image
        sudo docker ps -aq --filter "ancestor=search-bar" | xargs -r sudo docker rm
        
        # Build the new image
        sudo docker build -t search-bar -f Docker/DockerFile .
        
        # Run the new container
        sudo docker run -d --name search-bar-container -p 5000:5000 search-bar
